<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | NIGSTA HABASHA</title><link rel="stylesheet" href="/style.css"><script src="/account.js" defer></script></head>
<body><header class="header"><a class="brand" href="/">NIGSTA <span>HABASHA</span></a><a href="/">← Continue shopping</a></header>
<main class="account-page"><p class="eyebrow">YOUR ACCOUNT</p><h1>Welcome to NIGSTA HABASHA</h1><p class="muted">Sign in or create an account to manage your orders.</p><p id="account-message" class="form-message" role="status"></p>
<div id="auth-section" class="account-columns"><section class="panel"><h2>Create account</h2><form id="signup-form"><label for="signup-name">Full name</label><input id="signup-name" name="name" required minlength="2" maxlength="100" autocomplete="name"><label for="signup-email">Email</label><input id="signup-email" name="email" type="email" required autocomplete="email"><label for="signup-password">Password (at least 8 characters)</label><input id="signup-password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"><button class="button" type="submit">Create account</button></form></section>
<section class="panel"><h2>Log in</h2><form id="login-form"><label for="login-email">Email</label><input id="login-email" name="email" type="email" required autocomplete="email"><label for="login-password">Password</label><input id="login-password" name="password" type="password" required autocomplete="current-password"><button class="button" type="submit">Log in</button></form></section></div>
<section id="customer-section" hidden><div class="panel"><h2 id="welcome"></h2><button id="logout-button" type="button">Log out</button></div>
<div class="panel"><h2>Checkout</h2><p class="muted">Add products to your bag on the homepage first.</p><form id="checkout-form"><label for="delivery-name">Recipient name</label><input id="delivery-name" required maxlength="100" autocomplete="name"><label for="delivery-phone">Phone number</label><input id="delivery-phone" required maxlength="30" autocomplete="tel"><label for="delivery-address">Delivery address</label><textarea id="delivery-address" required minlength="5" maxlength="500" rows="3" autocomplete="street-address"></textarea><label for="payment-method">Payment method</label><select id="payment-method" required><option value="cash_on_delivery">Cash on delivery</option><option value="telebirr">Telebirr (integration required)</option><option value="cbe_birr">CBE Birr (integration required)</option></select><button class="button" type="submit">Place order</button></form></div>
<div class="panel"><h2>Your orders</h2><div id="orders-list"></div></div></section></main></body></html>
